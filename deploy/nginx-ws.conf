# ---------------------------------------------------------------------------
# 弹弹堂 · 风之物语 —— Nginx WebSocket 反向代理
#
# 用法（宝塔面板）：
#   网站 -> 你的站点 -> 设置 -> 配置文件
#   把下面的 location 段放进对应的 server { } 里。
#
# 如果宝塔的“反向代理”已经生成了 location /，不要重复粘贴下面的
# location / 段，只补充 location /ws 段即可。
#
# Node 进程默认只监听 127.0.0.1:3000，所以必须由同机 Nginx 转发。
# ---------------------------------------------------------------------------

# WebSocket：联机房间连接。路径必须保持 /ws，不能加尾部斜杠。
location /ws {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 房间连接是长连接，服务端每 30 秒会发 ping。
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# 普通页面和静态资源。
# 只有在你没有使用宝塔“反向代理”自动生成 location / 时才需要这一段。
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
